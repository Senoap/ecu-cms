# deploy/nginx.conf
# Konfigurasi Nginx Produksi untuk ESU Company
# Domain Utama: esu.co.id (www.esu.co.id)
# Subdomain Admin: admin.esu.co.id
# Internal PostgREST Loopback: 127.0.0.1:8081

# 1. Zona Rate Limiting (Proteksi Lapis Kedua di Depan Aplikasi)
# Hanya terapkan limit jika HTTP method adalah POST (Server Action & Form Submission)
# GET request (membuka halaman) tidak dihitung sehingga pengguna tidak terganggu.
map $request_method $post_binary_remote_addr {
    POST $binary_remote_addr;
    default "";
}

limit_req_zone $post_binary_remote_addr zone=login_post_limit:10m rate=10r/m;
limit_req_zone $post_binary_remote_addr zone=apply_post_limit:10m rate=5r/m;
limit_req_status 429;

# 2. Cloudflare Real-IP Resolution (Jika menggunakan proxy Cloudflare)
# Memastikan $remote_addr mencerminkan IP asli pengunjung, bukan IP edge Cloudflare
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;

# ==============================================================================
# 3. LISTENER INTERNAL LOOPBACK (POSTGREST REWRITE /rest/v1/ -> /)
# HANYA mengikat 127.0.0.1:8081, TIDAK BISA DIJANGKAU DARI INTERNET!
# ==============================================================================
server {
    listen 127.0.0.1:8081;
    server_name 127.0.0.1 localhost;

    location /rest/v1/ {
        # Trailing slash pada proxy_pass otomatis menghapus prefix /rest/v1/
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# 4. SERVER BLOCK: DOMAIN UTAMA (Website Publik Company Profile)
# ==============================================================================
server {
    listen 80;
    server_name esu.co.id www.esu.co.id;

    # Batas upload publik: 8 MB (Cukup untuk form CV 5 MB + metadata)
    client_max_body_size 8M;

    # Security Headers Standar
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Media Alias (Gambar CMS dilayani langsung oleh Nginx dari shared)
    location /uploads/ {
        alias /var/www/esu-company/shared/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }

    # Proteksi Rate Limiting Form Lamaran Kerja (Hanya me-limit method POST / Server Action)
    location ~ ^/career/ {
        limit_req zone=apply_post_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse Proxy ke Next.js (Bind Loopback 127.0.0.1:3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # PENTING: Lokasi /rest/v1/ TIDAK ADA di sini. Permintaan dari luar akan return 404!
}

# ==============================================================================
# 5. SERVER BLOCK: SUBDOMAIN CMS (cms.4sinergiutama.co.id / cms-4su.4sinergiutama.co.id)
# ==============================================================================
server {
    listen 80;
    server_name cms.4sinergiutama.co.id cms-4su.4sinergiutama.co.id cms.esu.co.id admin.esu.co.id;

    # Batas upload admin: 25 MB (Untuk dokumen legalitas & media CMS)
    client_max_body_size 25M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Media Alias untuk Admin
    location /uploads/ {
        alias /var/www/esu-company/shared/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff";
    }

    # Proteksi Brute-Force Login Admin (Hanya me-limit method POST)
    location = /login {
        limit_req zone=login_post_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
