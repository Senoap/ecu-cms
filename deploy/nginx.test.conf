# deploy/nginx.test.conf
# Konfigurasi Nginx untuk Dry-Run Test Container

map $request_method $post_binary_remote_addr {
    POST $binary_remote_addr;
    default "";
}

limit_req_zone $post_binary_remote_addr zone=login_post_limit:10m rate=10r/m;
limit_req_zone $post_binary_remote_addr zone=apply_post_limit:10m rate=5r/m;
limit_req_status 429;

# Listener 8081: Internal PostgREST rewrite
server {
    listen 8081;
    server_name _;

    location /rest/v1/ {
        proxy_pass http://postgrest:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Listener 80: Web Profiling & Rate Limit Verification
server {
    listen 80;
    server_name _;

    # Test route: Form Lamaran Karir
    location ~ ^/career/ {
        limit_req zone=apply_post_limit burst=3 nodelay;
        proxy_pass http://postgrest:3000;
    }

    # Test route: Login Admin
    location = /login {
        limit_req zone=login_post_limit burst=5 nodelay;
        default_type text/plain;
        return 200 "Login Page/Action Accepted\n";
    }

    location / {
        default_type text/plain;
        return 200 "Main App Root\n";
    }
}
